[project]
name = "lightonocr"
version = "0.1.0"
description = "Minimal inference client, CLI and viewer for LightOnOCR (1, 2 and 3) served with vLLM"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pillow>=10",
    "pypdfium2>=4",
]

[project.optional-dependencies]
# The model server, for `uv sync --extra vllm`. vLLM 0.27.1 makes the models loop; 0.30.0 is tested.
# transformers 5.17 renamed PixtralRotaryEmbedding, which vLLM 0.30.0 imports for the 1B models
# (LightOnOCR-1, -2 and LightOnOCR-3-1B): pin 5.16.1.
vllm = [
    "vllm==0.30.0",
    "transformers==5.16.1",
]

[project.scripts]
lightonocr = "lightonocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lightonocr"]

# The package only: benchmarks/ is a separate project, paper.pdf and docs/ belong to the repository.
[tool.hatch.build.targets.sdist]
include = ["lightonocr"]
